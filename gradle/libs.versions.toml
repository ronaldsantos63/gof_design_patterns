appcompat = "1.6.1"
material = "1.10.0"
jetbrainsKotlinJvm = "2.0.21"
hilt = "2.52"
retrofit = "2.11.0"
okhttp = "4.12.0"
room = "2.7.0"
paging = "3.3.2"
navigationCompose = "2.8.0"
mockk = "1.13.12"
turbine = "1.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
