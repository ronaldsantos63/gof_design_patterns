[versions]
agp = "8.13.0"
kotlin = "2.0.21"
coreKtx = "1.17.0"
coroutines = "1.9.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
